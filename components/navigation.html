<script>
    //  서브메뉴 열기
    $(".ad-gnb-title").click(function (e) {
        e.stopPropagation();
        const $targetSnb = $(this).siblings(".ad-snb");
        $(".ad-gnb-title").not(this).removeClass("active");
        $(".ad-snb").not($targetSnb).removeClass("active");
        $targetSnb.toggleClass("active");
        $(this).toggleClass("active");
    });
    $(document).ready(function () {
        const currentPath = window.location.pathname;
        $(".snb-list a").each(function () {
            const linkHref = $(this).attr("href");
            const isHomeMatch = linkHref === "/" && (currentPath === "/" || currentPath === "");
            const isNormalMatch = linkHref !== "#" && linkHref !== "/" && currentPath.includes(linkHref);

            console.log(currentPath, "현재 경로 ");
            console.log(linkHref, "href ");
            if (linkHref === currentPath || isHomeMatch || isNormalMatch) {
                $(this).closest(".snb-list").addClass("active");

                const $gnbItem = $(this).closest(".ad-gnb-item");
                $gnbItem.find(".ad-gnb-title").addClass("active");
                $gnbItem.find(".ad-snb").addClass("active");
            }
        });
    });
</script>
