    <body>
        <div id="wrap">
            <header id="header"></header>
            <main>
                <section class="w-full pt-20 pb-10 md:pt-25 md:pb-14">
                    <div class="mx-auto flex w-full max-w-400 flex-col items-center gap-5 px-5">
                        <h2 class="my-10 text-[32px] font-bold md:my-15 md:text-[56px]">스튜디오 대관 예약</h2>

                        <!--  필터링   -->
                        <div class="flex w-full items-start justify-between">
                            <button type="button" class="flex gap-2.5 rounded-3xl border border-black/20 px-3.5 py-2.5">
                                <i data-lucide="funnel" class="w-4 text-gray-900"></i>
                                <span>필터 설정</span>
                            </button>
                            <div class="flex gap-2">
                                <div class="dropdown" data-year-dropdown>
                                    <button type="button" class="btn-shape">
                                        <span class="text-xl font-bold md:text-2xl">2026년</span>
                                        <i data-lucide="chevron-down" class="size-6 stroke-2"></i>
                                    </button>

                                    <ul class="drop-year">
                                        <li>2026년</li>
                                        <li>2027년</li>
                                        <li>2028년</li>
                                        <li>2029년</li>
                                        <li>2030년</li>
                                        <li>2031년</li>
                                    </ul>
                                </div>
                                <div class="dropdown rounded-lg" data-year-dropdown>
                                    <button type="button" class="btn-shape">
                                        <span class="text-xl font-bold md:text-2xl">9월</span>
                                        <i data-lucide="chevron-down" class="size-6 stroke-2"></i>
                                    </button>

                                    <ul class="drop-year">
                                        <li>1월</li>
                                        <li>2월</li>
                                        <li>3월</li>
                                        <li>4월</li>
                                        <li>5월</li>
                                        <li>6월</li>
                                        <li>7월</li>
                                        <li>8월</li>
                                        <li>9월</li>
                                        <li>10월</li>
                                        <li>11월</li>
                                        <li>12월</li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <div id="calendar" class="reservation-calendar"></div>
                    </div>
                </section>
            </main>
            <!-- <footer id="footer"></footer> -->
        </div>
        <!-- JS (lucide, chart.js, calendar) -->
        <script src="/js/jquery.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.15/locales/ko.global.min.js"></script>
        <script src="/js/script.js"></script>
        <script src="/js/modal.js"></script>

        <script>
            //  드롭 다운
            $("[data-year-dropdown]").on("click", "button", function () {
                const $wrap = $(this).closest("[data-year-dropdown]");
                const isActive = $wrap.hasClass("active");

                $("[data-year-dropdown]").removeClass("active");
                $("[data-year-dropdown] ul").removeClass("active");

                if (!isActive) {
                    $wrap.addClass("active");
                    $(this).next("ul").addClass("active");
                }
            });
            $("[data-year-dropdown]").on("click", "li", function () {
                const $wrap = $(this).closest("[data-year-dropdown]");
                $wrap.find("button span").text($(this).text().trim());
                $("[data-year-dropdown]").removeClass("active");
                $("[data-year-dropdown] ul").removeClass("active");
            });
            $(document).on("click", function (e) {
                if (!$(e.target).closest("[data-year-dropdown]").length) {
                    $("[data-year-dropdown]").removeClass("active");
                    $("[data-year-dropdown] ul").removeClass("active");
                }
            });

            //  캘린더
            document.addEventListener("DOMContentLoaded", function () {
                let startDate = null;
                const calendarEl = document.querySelector("#calendar");
                const calendar = new FullCalendar.Calendar(calendarEl, {
                    initialView: "dayGridMonth",
                    height: "auto",
                    contentHeight: "auto",
                    headerToolbar: false,
                    fixedWeekCount: false,
                    handleWindowResize: true,

                    dateClick: function (info) {
                        const clickedDate = info.dateStr;
                        if (!startDate) {
                            startDate = clickedDate;

                            document.querySelectorAll(".reservation-calendar .fc-daygrid-day").forEach((el) => {
                                el.classList.remove("is-selected", "is-edge");
                            });

                            info.dayEl.classList.add("is-selected", "is-edge");
                        } else {
                            const start = startDate < clickedDate ? startDate : clickedDate;
                            const end = startDate < clickedDate ? clickedDate : startDate;

                            // 전체 셀을 돌면서 시작~끝 사이에 포함되면 스타일 적용
                            document.querySelectorAll(".reservation-calendar .fc-daygrid-day").forEach((el) => {
                                el.classList.remove("is-selected", "is-edge");
                                const cellDate = el.getAttribute("data-date");
                                if (cellDate && cellDate >= start && cellDate <= end) {
                                    el.classList.add("is-selected");
                                    if (cellDate === start || cellDate === end) {
                                        el.classList.add("is-edge");
                                    }
                                }
                            });
                            startDate = null;
                        }
                    },
                    dayCellDidMount: function (arg) {
                        if (arg.el.classList.contains("fc-day-today")) {
                            const topFrame = arg.el.querySelector(".fc-daygrid-day-top");
                            if (topFrame) {
                                const badge = document.createElement("span");

                                badge.className = "today-badge";
                                badge.innerText = "TODAY";

                                topFrame.appendChild(badge);
                            }
                        }
                    },
                });
                calendar.render();
            });
        </script>
